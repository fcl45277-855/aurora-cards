name: cpu-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.5.0 scipy==1.18.0 pytest==9.1.1
      - name: Data-free tests (TorchAO bit-exact test is skipped without TorchAO)
        run: python -m pytest tests -q -rs
      - name: Self-test script
        run: python tests/selftest_check.py
      - name: Paper tables from the released summaries
        run: python scripts/paper_tables.py
